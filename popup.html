<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 14px; width: 250px; }
    #count { font-size: 34px; font-weight: 700; line-height: 1; }
    #count small { font-size: 16px; font-weight: 500; opacity: .6; }
    #next, #read, #account { opacity: .75; margin-top: 4px; }
    #msg { margin-top: 8px; color: #d9480f; }
    #msg:empty { display: none; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
    input[type=number] { width: 56px; padding: 3px 4px; font: inherit; }
    button { font: inherit; padding: 5px 10px; width: 100%; margin-top: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="count">-</div>
  <div id="next"></div>
  <div id="read"></div>
  <div id="account"></div>
  <div id="msg"></div>
  <label class="row">Alerter à partir de
    <input id="threshold" type="number" min="1" max="99" step="1">
  </label>
  <button id="refresh" type="button">Vérifier maintenant</button>
  <script src="logic.js"></script>
  <script src="popup.js"></script>
</body>
</html>
